<?xml version="1.0" encoding="UTF-8"?>
<svg width="24" height="24" viewBox="0 0 24 24" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <g id="history-icon">
    <!-- Background circle -->
    <circle cx="12" cy="12" r="11" fill="#fefbf5" stroke="#091316" stroke-width="1"/>
    
    <!-- Stylized letter H -->
    <g id="letter-h">
      <!-- Left vertical bar -->
      <rect x="7" y="6" width="2.5" height="12" fill="#091316" rx="1.25"/>
      
      <!-- Right vertical bar -->
      <rect x="14.5" y="6" width="2.5" height="12" fill="#091316" rx="1.25"/>
      
      <!-- Horizontal crossbar -->
      <rect x="7" y="11" width="10" height="2" fill="#091316" rx="1"/>
      
      <!-- Small decorative dots for history effect -->
      <circle cx="5" cy="8" r="0.8" fill="#091316" opacity="0.6"/>
      <circle cx="5" cy="12" r="0.8" fill="#091316" opacity="0.4"/>
      <circle cx="5" cy="16" r="0.8" fill="#091316" opacity="0.2"/>
      
      <circle cx="19" cy="8" r="0.8" fill="#091316" opacity="0.6"/>
      <circle cx="19" cy="12" r="0.8" fill="#091316" opacity="0.4"/>
      <circle cx="19" cy="16" r="0.8" fill="#091316" opacity="0.2"/>
    </g>
  </g>
</svg>