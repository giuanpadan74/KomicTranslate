<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <!-- Carattere ↵ (enter/return) -->
  <text x="12" y="16" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#333333">↵</text>
  
  <!-- Riga rossa diagonale per sbarrare -->
  <line x1="4" y1="4" x2="20" y2="20" stroke="#ff0000" stroke-width="2" stroke-linecap="round"/>
</svg>